<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rest timer</title>
<style>
:root {
  color-scheme: light dark;
  --bg: var(--color-background-primary, Canvas);
  --card: var(--color-background-secondary, color-mix(in srgb, CanvasText 5%, Canvas));
  --fg: var(--color-text-primary, CanvasText);
  --muted: var(--color-text-secondary, color-mix(in srgb, CanvasText 60%, Canvas));
  --line: var(--color-border-primary, color-mix(in srgb, CanvasText 14%, Canvas));
  --accent: var(--color-text-info, #2563eb);
  --done: var(--color-text-success, #16a34a);
  --warn: var(--color-text-warning, #b45309);
  --bad: var(--color-text-danger, #dc2626);
  --radius: var(--border-radius-lg, 14px);
  --radius-sm: var(--border-radius-md, 10px);
  --font: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif);
  --tone: var(--accent);
}
* { box-sizing: border-box; }
body { margin: 0; padding: 14px; background: var(--bg); color: var(--fg); font: 15px/1.4 var(--font); -webkit-font-smoothing: antialiased; }
body[data-state="ready"] { --tone: var(--done); }
body[data-state="stopped"], body[data-state="idle"], body[data-state="none"] { --tone: var(--muted); }
main { display: grid; gap: 12px; max-width: 440px; margin: 0 auto; }
[hidden] { display: none !important; }

/* Timer: a ring with the clock inside, and its two controls under it. */
.timer { display: grid; justify-items: center; gap: 10px; padding: 6px 0 2px; }
.ring { position: relative; width: 188px; height: 188px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 9; }
.ring .track { stroke: var(--line); }
.ring .arc { stroke: var(--tone); stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke .3s; }
.center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 2px; padding: 0 30px; }
#status { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .02em; color: var(--tone); }
#clock { font-size: 46px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.05; letter-spacing: -.02em; min-height: 1.05em; }
#sub { margin: 0; font-size: 13px; color: var(--muted); min-height: 1.4em; }
body[data-state="ready"] #clock { color: var(--done); }
body[data-state="none"] #clock, body[data-state="idle"] #clock, body[data-state="superset"] #clock { color: var(--muted); font-size: 34px; }
.controls { display: flex; gap: 8px; }

button { font: inherit; color: inherit; cursor: pointer; border-radius: 999px; min-height: 40px; padding: 0 16px;
  border: 1px solid var(--line); background: var(--bg); font-weight: 600; transition: transform .08s, background .15s, opacity .15s; }
button:hover:not(:disabled) { background: var(--card); }
button:active:not(:disabled) { transform: scale(.97); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .5; cursor: progress; }
button.primary { width: 100%; min-height: 48px; border: 0; background: var(--done); color: #fff; font-size: 16px; border-radius: var(--radius-sm); }
button.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--done) 88%, #000); }
button.link { border: 0; background: none; min-height: 32px; padding: 0 6px; color: var(--accent); font-weight: 600; }
button.link:hover:not(:disabled) { background: none; text-decoration: underline; }

/* Next set: a card with weight and reps steppers and one big Done. */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 12px; }
.card header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pill { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; padding: 2px 9px; border-radius: 999px;
  background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
#next-name { margin: -6px 0 0; font-size: 20px; font-weight: 700; text-transform: capitalize; }
.steppers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stepper { display: grid; grid-template-columns: 36px 1fr 36px; align-items: center; background: var(--bg);
  border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 4px; }
.stepper button { min-height: 36px; padding: 0; border: 0; border-radius: 8px; font-size: 20px; line-height: 1; }
.field { display: grid; justify-items: center; }
.field input { width: 100%; min-width: 0; border: 0; background: none; color: inherit; text-align: center;
  font: 700 22px/1.2 var(--font); font-variant-numeric: tabular-nums; padding: 0; -moz-appearance: textfield; }
.field input::-webkit-outer-spin-button, .field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.field span { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); cursor: pointer; justify-self: start; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }

/* Last set: one line, editable in place. */
.last { display: grid; gap: 8px; padding: 0 4px; }
.last-line { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.last-line strong { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.edit { display: grid; grid-template-columns: 1fr 1fr auto auto; gap: 8px; align-items: center; }
.edit input { width: 100%; min-width: 0; min-height: 40px; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 0 10px;
  background: var(--bg); color: inherit; font: 600 15px var(--font); font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.edit input::-webkit-outer-spin-button, .edit input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

#notice { margin: 0; padding: 10px 12px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500;
  background: color-mix(in srgb, var(--tone-n, var(--accent)) 12%, transparent); color: var(--fg);
  border-left: 3px solid var(--tone-n, var(--accent)); }
#notice[data-kind="ok"] { --tone-n: var(--done); }
#notice[data-kind="pending"] { --tone-n: var(--warn); }
#notice[data-kind="error"] { --tone-n: var(--bad); }
footer { display: flex; justify-content: center; }

@media (max-width: 340px) { .ring { width: 160px; height: 160px; } #clock { font-size: 40px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body data-state="none">
<main>
  <section class="timer" aria-label="Rest">
    <div class="ring">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="track" cx="60" cy="60" r="52"></circle>
        <circle class="arc" id="arc" cx="60" cy="60" r="52" stroke-dasharray="326.73" stroke-dashoffset="326.73"></circle>
      </svg>
      <div class="center">
        <p id="status" role="status" aria-live="polite">Loading rest…</p>
        <div id="clock" role="timer" aria-live="off" aria-atomic="true"></div>
        <p id="sub"></p>
      </div>
    </div>
    <div class="controls" id="controls" hidden>
      <button id="plus" type="button" aria-label="Add 30 seconds to this rest">+30 s</button>
      <button id="stop" type="button">Stop rest</button>
    </div>
  </section>

  <section class="card" id="next" hidden aria-labelledby="next-name">
    <header><span class="eyebrow">Next set</span><span class="pill" id="next-count" hidden></span></header>
    <h2 id="next-name"></h2>
    <div class="steppers">
      <div class="stepper">
        <button type="button" data-field="weight" data-dir="-1" aria-label="Less weight">−</button>
        <label class="field"><input id="weight" type="number" inputmode="decimal" min="0" step="any" placeholder="0" aria-describedby="unit"><span id="unit">kg</span></label>
        <button type="button" data-field="weight" data-dir="1" aria-label="More weight">+</button>
      </div>
      <div class="stepper">
        <button type="button" data-field="reps" data-dir="-1" aria-label="Fewer reps">−</button>
        <label class="field"><input id="reps" type="number" inputmode="numeric" min="1" step="1"><span>reps</span></label>
        <button type="button" data-field="reps" data-dir="1" aria-label="More reps">+</button>
      </div>
    </div>
    <label class="check"><input id="warmup" type="checkbox"> Warm-up set</label>
    <button id="done" class="primary" type="button">Done ✓</button>
  </section>

  <section class="last" id="last" hidden>
    <div class="last-line"><span>Last</span><strong id="last-text"></strong><button id="edit" class="link" type="button">Edit</button></div>
    <form class="edit" id="edit-form" hidden>
      <input id="edit-weight" type="number" inputmode="decimal" min="0" step="any" aria-label="Weight">
      <input id="edit-reps" type="number" inputmode="numeric" min="1" step="1" aria-label="Reps">
      <button type="submit">Save</button>
      <button class="link" id="edit-cancel" type="button">Cancel</button>
    </form>
  </section>

  <p id="notice" role="status" aria-live="polite" hidden></p>
  <footer><button id="refresh" class="link" type="button">Refresh</button></footer>
</main>
<!--SCRIPT-->
</body>
</html>
