<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rest timer</title>
<style>
:root {
  color-scheme: light dark;
  --bg: var(--color-background-primary, Canvas);
  --fg: var(--color-text-primary, CanvasText);
  --muted: var(--color-text-secondary, GrayText);
  --accent: var(--color-text-info, #2563eb);
  --done: var(--color-text-success, #15803d);
  --radius: var(--border-radius-md, 8px);
  --font: var(--font-sans, system-ui, sans-serif);
}
* { box-sizing: border-box; }
body { margin: 0; padding: 12px 16px; background: var(--bg); color: var(--fg); font: 15px/1.4 var(--font); }
main { display: grid; gap: 6px; max-width: 420px; }
#status { margin: 0; font-weight: 600; }
#clock { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; min-height: 1.1em; }
body[data-state="ready"] #clock { color: var(--done); }
progress { width: 100%; height: 8px; accent-color: var(--accent); }
body[data-state="ready"] progress { accent-color: var(--done); }
#detail { margin: 0; color: var(--muted); font-size: 13px; }
button { justify-self: start; font: inherit; padding: 6px 12px; border-radius: var(--radius);
  border: 1px solid var(--color-border-primary, currentColor); background: transparent; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .6; cursor: progress; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body data-state="none">
<main>
  <p id="status" role="status" aria-live="polite">Loading rest…</p>
  <div id="clock" role="timer" aria-live="off" aria-atomic="true"></div>
  <progress id="bar" hidden aria-label="Rest progress"></progress>
  <p id="detail"></p>
  <button id="refresh" type="button">Refresh</button>
</main>
<!--SCRIPT-->
</body>
</html>
