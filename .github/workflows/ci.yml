name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref. A newer push to a pull request supersedes the older run;
# runs on main are never cancelled, so every commit that reaches the server
# keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The race-enabled suite is split across runners: one runner has four cores
  # and the suite needs about four times that. Each shard is a list of whole
  # packages; "rest" is every package the others do not name, so a new package
  # is tested without editing this file.
  go-test:
    name: go test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [mcpsrv, web, rest]
    env:
      # Packages given their own runner, as patterns over `go list ./...`.
      MCPSRV: '/internal/mcpsrv$'
      WEB: '/internal/(websrv|engine)$'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      # Formatting is not a matter of taste here: an unformatted diff makes
      # every later review noisier than it needs to be.
      - name: gofmt
        if: matrix.shard == 'rest'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        if: matrix.shard == 'rest'
        run: go vet ./...

      - name: packages in this shard
        run: |
          case "${{ matrix.shard }}" in
            mcpsrv) go list ./... | grep -E "$MCPSRV" ;;
            web) go list ./... | grep -E "$WEB" ;;
            rest) go list ./... | grep -vE "$MCPSRV" | grep -vE "$WEB" ;;
          esac > packages.txt
          cat packages.txt
          test -s packages.txt

      # -race because the HTTP server and the MCP handler are concurrent, and a
      # data race there corrupts training data rather than crashing loudly.
      - name: go test
        run: go test -race -count=1 -coverprofile=coverage.out $(cat packages.txt)

      # The store is the layer that touches the data. Let coverage rot anywhere
      # else, but not there. Measured as package statement coverage, not an
      # average of per-function percentages, which weights a one-line helper
      # the same as a hundred-line transaction. Read from the profile the test
      # step already wrote, rather than running the store's tests a second
      # time: only the package's own files, not its sqlitestoretest helper.
      - name: coverage floor for the store
        if: matrix.shard == 'rest'
        run: |
          grep -E '^mode:|/internal/sqlitestore/[^/]+\.go:' coverage.out > store.cov
          pct="$(go tool cover -func=store.cov \
            | sed -n 's/^total:.*[[:space:]]\([0-9.]*\)%$/\1/p')"
          echo "sqlitestore statement coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN {exit !(p < 70)}' && {
            echo "below the 70% floor" >&2
            exit 1
          }
          echo "ok"

  # The check to wait for before merging, as before the split: green only when
  # every shard passed.
  test:
    needs: go-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every shard passed
        run: test "${{ needs.go-test.result }}" = success

  # The image is what actually ships, so it must build and boot here, not for
  # the first time on the server. See docs/deployment.md.
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: training-mcp:ci
      CONTAINER: training-mcp-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The server's deploy agent checks the repository out with umask 0077,
      # so every file in the build context is readable by its owner only, and
      # COPY keeps those modes. The runner's checkout is world-readable, which
      # would hide an image whose files the non-root user cannot read.
      - name: strip group and other permissions like the server checkout
        run: chmod -R go-rwx .

      - name: docker build
        run: docker build -t "$IMAGE" .

      # The runtime image is distroless (no shell, no curl), so the probe runs
      # from the runner. No volume is mounted: the image's own /data must be
      # writable by the non-root user, as it is when production mounts its
      # named volume there for the first time. The token is a throwaway value
      # for this container only, not a secret.
      - name: boot the image and probe /health
        run: |
          set -euo pipefail
          docker run -d --name "$CONTAINER" -p 127.0.0.1:8080:8080 \
            -e MCP_BEARER_TOKEN=ci-smoke-token "$IMAGE"

          body=""
          for _ in $(seq 1 30); do
            if body="$(curl -fsS --max-time 2 http://127.0.0.1:8080/health)"; then
              break
            fi
            body=""
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER")" != "true" ]; then
              echo "the container exited before answering /health" >&2
              exit 1
            fi
            sleep 1
          done
          if [ -z "$body" ]; then
            echo "/health did not answer within 30s" >&2
            exit 1
          fi
          echo "/health: $body"
          jq -e '.status == "ok"' <<<"$body" >/dev/null

          # Auth is on: /mcp without the token must be refused.
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/mcp)"
          echo "/mcp without a token: $code"
          test "$code" = "401"

          # The server applied its migrations before listening, so the database
          # file must exist under /data and be a real SQLite file.
          docker cp "$CONTAINER:/data/training.db" "$RUNNER_TEMP/training.db"
          header="$(head -c 15 "$RUNNER_TEMP/training.db")"
          echo "/data/training.db header: $header"
          test "$header" = "SQLite format 3"

      # The coach's engine runs on Node inside the same image. With its stdin
      # closed at once it must still load the Pi SDK, report its version and
      # exit cleanly: a broken install or unreadable files fail here.
      - name: the coach engine loads in the image
        run: |
          set -euo pipefail
          line="$(docker run --rm -i --entrypoint /nodejs/bin/node "$IMAGE" /app/engine/main.ts </dev/null)"
          echo "engine: $line"
          jq -e '.type == "ready" and .piVersion == "1.5.2"' <<<"$line" >/dev/null

      # Enabled, the coach must not stop the server from booting, and its routes
      # answer behind the web login at the root, the app's only entrance. The
      # key and the provider settings are throwaways for this container only;
      # nobody signs in, as that would call the provider.
      - name: boot with the coach enabled
        run: |
          set -euo pipefail
          docker run -d --name "$CONTAINER-coach" -p 127.0.0.1:8081:8080 \
            -e MCP_BEARER_TOKEN=ci-smoke-token \
            -e MCP_OAUTH_ISSUER=https://auth.example.invalid -e MCP_OAUTH_RESOURCE=https://training.example.invalid/mcp \
            -e MCP_OAUTH_SUBJECT=user_ci -e WEB_OAUTH_CLIENT_ID=ci-web -e WEB_OAUTH_CLIENT_SECRET=ci-web-secret \
            -e TRAINING_COACH=1 -e TRAINING_COACH_KEY="$(head -c 32 /dev/urandom | base64)" "$IMAGE"
          for _ in $(seq 1 30); do
            curl -fsS --max-time 2 http://127.0.0.1:8081/health >/dev/null 2>&1 && break
            sleep 1
          done
          # Anonymous or with the static bearer, the app sends you to sign in.
          for who in anonymous bearer; do
            auth=()
            [ "$who" = bearer ] && auth=(-H 'Authorization: Bearer ci-smoke-token')
            read -r code location < <(curl -sS -o /dev/null "${auth[@]}" -w '%{http_code} %{redirect_url}\n' http://127.0.0.1:8081/coach/status)
            echo "/coach/status ($who): $code $location"
            test "$code" = "303"
            test "${location##*/}" = "login"
          done

      - name: container logs
        if: failure()
        run: |
          docker logs "$CONTAINER" || true
          docker logs "$CONTAINER-coach" || true

      - name: remove the container
        if: always()
        run: docker rm -f "$CONTAINER" "$CONTAINER-coach" >/dev/null 2>&1 || true
